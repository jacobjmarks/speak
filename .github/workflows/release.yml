name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0 (tagged v1.2.0)'
        required: true
      prerelease:
        description: 'Pre-release (installed apps will not auto-update to it)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Validate version
        shell: pwsh
        run: |
          if ('${{ inputs.version }}' -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3" }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Stamp version (used by the in-app updater)
        shell: pwsh
        run: Set-Content speak/_build.py 'VERSION = "${{ inputs.version }}"'

      - name: Build single-file executable
        shell: pwsh
        run: .\build.ps1 -OutputDirectory .\release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Speak ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
          generate_release_notes: true
          body: |
            Windows x64 build. Speech and tidy-up models download on first use.
          files: release/Speak.exe