name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to release, e.g. 1.0.0-alpha.1, 1.0.0-rc.1 or 1.0.0 (tagged v<version>). A -suffix makes it a pre-release'
        required: true
      ref:
        description: 'Commit SHA, branch or tag to build (default: latest main)'
        required: false
        default: 'main'
      latest:
        description: 'Mark as the Latest release. auto = only if stable and higher than every existing stable release'
        type: choice
        options: [auto, 'yes', 'no']
        default: auto

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          # Same pattern as speak/updates.py SEMVER (https://semver.org), without a leading v
          $id = '(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)'
          $semver = "^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-($id(?:\.$id)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          if ('${{ inputs.version }}' -cnotmatch $semver) { throw "Version must be semver without a v, e.g. 1.0.0, 1.0.0-alpha.1, 1.0.0-rc.1" }
          "prerelease=$(if ($Matches[4]) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # tags + history, to find issues closed since the last release

      - name: Resolve commit
        id: commit
        shell: pwsh
        run: |
          if (git tag -l "v${{ inputs.version }}") { throw "Tag v${{ inputs.version }} already exists" }
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Decide Latest
        id: latest
        shell: pwsh
        run: |
          $pre = '${{ steps.version.outputs.prerelease }}' -eq 'true'
          $choice = '${{ inputs.latest }}'
          if ($choice -eq 'yes' -and $pre) { throw "A pre-release can't be marked Latest" }
          $latest = switch ($choice) {
            'yes' { $true }
            'no' { $false }
            default {
              # Stable tags only (vX.Y.Z or vX.Y.Z+build); semver order matches [version] for these
              $stable = git tag -l 'v*' | Where-Object { $_ -match '^v(\d+\.\d+\.\d+)(\+.*)?$' } | ForEach-Object { [version]$Matches[1] }
              $new = [version]('${{ inputs.version }}' -replace '[-+].*$')
              -not $pre -and -not ($stable | Where-Object { $_ -ge $new })
            }
          }
          Write-Host "Latest: $latest"
          "value=$($latest.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Stamp version (used by the in-app updater)
        shell: pwsh
        run: Set-Content speak/_build.py 'VERSION = "${{ inputs.version }}"'

      - name: Find issues closed since the last release
        id: issues
        shell: pwsh
        run: |
          $previous = git describe --tags --abbrev=0 HEAD 2>$null
          $range = if ($previous) { "$previous..HEAD" } else { "HEAD" }
          $numbers = git log --format=%B $range |
            Select-String -AllMatches '(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)' |
            ForEach-Object { $_.Matches } | ForEach-Object { [int]$_.Groups[1].Value } | Sort-Object -Unique
          "numbers=$($numbers -join ' ')" >> $env:GITHUB_OUTPUT
          $lines = $numbers | ForEach-Object { "- #$_" }
          $notes = if ($lines) { "### Issues resolved`n" + ($lines -join "`n") } else { "" }
          "notes<<EOF`n$notes`nEOF" >> $env:GITHUB_OUTPUT

      - name: Build single-file executable
        shell: pwsh
        run: .\build.ps1 -OutputDirectory .\release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Speak ${{ inputs.version }}
          target_commitish: ${{ steps.commit.outputs.sha }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.latest.outputs.value }}
          generate_release_notes: true
          body: |
            Windows x64 build. Speech and tidy-up models download on first use.

            ${{ steps.issues.outputs.notes }}
          files: release/Speak.exe

      - name: Comment the release on resolved issues
        if: steps.issues.outputs.numbers != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }}"
          foreach ($n in '${{ steps.issues.outputs.numbers }}'.Split(' ')) {
            gh issue comment $n --repo ${{ github.repository }} --body "Released in [Speak ${{ inputs.version }}]($url)."
            if (-not $?) { Write-Warning "Couldn't comment on #$n" }
          }