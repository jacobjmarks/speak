name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver to release, e.g. 1.0.0-alpha.1, 1.0.0-rc.1 or 1.0.0 (tagged v<version>). A -suffix makes it a pre-release'
        required: true
      ref:
        description: 'Commit SHA, branch or tag to build (default: latest main)'
        required: false
        default: 'main'
      latest:
        description: 'Mark as the Latest release. auto = only if stable and higher than every existing stable release'
        type: choice
        options: [auto, 'yes', 'no']
        default: auto

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.latest.outputs.value }}
      sha: ${{ steps.commit.outputs.sha }}
      numbers: ${{ steps.issues.outputs.numbers }}
      notes: ${{ steps.issues.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $id = '(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)'
          $semver = "^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-($id(?:\.$id)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          if ($env:VERSION -cnotmatch $semver) { throw 'Version must be semver without a v, e.g. 1.0.0 or 1.0.0-rc.1' }
          "prerelease=$(if ($Matches[4]) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Resolve commit
        id: commit
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if (git tag -l "v$env:VERSION") { throw "Tag v$env:VERSION already exists" }
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Decide Latest
        id: latest
        shell: pwsh
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          CHOICE: ${{ inputs.latest }}
          VERSION: ${{ inputs.version }}
        run: |
          $pre = $env:PRERELEASE -eq 'true'
          if ($env:CHOICE -eq 'yes' -and $pre) { throw "A pre-release can't be marked Latest" }
          $latest = switch ($env:CHOICE) {
            'yes' { $true }
            'no' { $false }
            default {
              $stable = git tag -l 'v*' | Where-Object { $_ -match '^v(\d+\.\d+\.\d+)(\+.*)?$' } | ForEach-Object { [version]$Matches[1] }
              $new = [version]($env:VERSION -replace '[-+].*$')
              -not $pre -and -not ($stable | Where-Object { $_ -ge $new })
            }
          }
          "value=$($latest.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Find issues closed since the last release
        id: issues
        shell: pwsh
        run: |
          $previous = git describe --tags --abbrev=0 HEAD 2>$null
          $range = if ($previous) { "$previous..HEAD" } else { 'HEAD' }
          $numbers = git log --format=%B $range |
            Select-String -AllMatches '(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)' |
            ForEach-Object { $_.Matches } | ForEach-Object { [int]$_.Groups[1].Value } | Sort-Object -Unique
          "numbers=$($numbers -join ' ')" >> $env:GITHUB_OUTPUT
          $lines = $numbers | ForEach-Object { "- #$_" }
          $notes = if ($lines) { "### Issues resolved`n" + ($lines -join "`n") } else { '' }
          "notes<<EOF`n$notes`nEOF" >> $env:GITHUB_OUTPUT

  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            package: Speak.exe
          - os: macos-15
            platform: macos-arm64
            package: Speak-macos-arm64.zip
          - os: ubuntu-22.04
            platform: linux-x86_64
            package: Speak-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Stamp version
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: 'Set-Content speak/_build.py "VERSION = `"$env:VERSION`""'

      - name: Build package
        shell: pwsh
        run: ./build.ps1 -OutputDirectory ./release

      - uses: actions/upload-artifact@v4
        with:
          name: Speak-${{ matrix.platform }}
          path: release/${{ matrix.package }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: Speak-*
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Speak ${{ inputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.latest }}
          generate_release_notes: true
          body: |
            Windows x64, macOS arm64, and Linux x64 builds. Speech and tidy-up models download on first use.

            macOS packages are unsigned and require manual Gatekeeper approval. Linux global hotkeys require an X11 session; native Wayland global shortcuts are not supported yet.

            ${{ needs.prepare.outputs.notes }}
          files: |
            release/Speak.exe
            release/Speak-macos-arm64.zip
            release/Speak-linux-x86_64.tar.gz

      - name: Comment the release on resolved issues
        if: needs.prepare.outputs.numbers != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = "${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ inputs.version }}"
          foreach ($n in '${{ needs.prepare.outputs.numbers }}'.Split(' ')) {
            gh issue comment $n --repo ${{ github.repository }} --body "Released in [Speak ${{ inputs.version }}]($url)."
            if (-not $?) { Write-Warning "Couldn't comment on #$n" }
          }