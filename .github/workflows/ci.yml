name: CI
run-name: ${{ github.event_name == 'pull_request' && format('CI · PR #{0} · {1}', github.event.number, github.event.pull_request.title) || format('CI · {0} · {1}', github.ref_name, github.event.head_commit.message) }}

# Lint and unit tests on every pull request and push to main. Packages are built only by build.yml (manual).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests with coverage and lint
        uses: ./.github/actions/python-ci-checks
