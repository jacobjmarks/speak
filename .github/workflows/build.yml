name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Stamp build id
        shell: pwsh
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: 'Set-Content speak/_build.py "VERSION = `"dev-$($env:SHA.Substring(0, 7))`""'

      - name: Build package
        shell: pwsh
        run: ./build.ps1 -OutputDirectory ./dist

      - uses: actions/upload-artifact@v4
        with:
          name: Speak-${{ matrix.platform }}-${{ github.sha }}
          path: dist/Speak-*
          retention-days: 14