name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            package: Speak.exe
          - os: macos-15
            platform: macos-arm64
            package: Speak-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Build package
        shell: pwsh
        run: ./build.ps1 -OutputDirectory ./dist

      - uses: actions/upload-artifact@v4
        with:
          name: Speak-${{ matrix.platform }}-${{ github.sha }}
          path: dist/${{ matrix.package }}
          retention-days: 14