name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Build single-file executable
        shell: pwsh
        run: .\build.ps1 -OutputDirectory .\dist

      - uses: actions/upload-artifact@v4
        with:
          name: Speak-windows-${{ github.sha }}
          path: dist/Speak.exe
          retention-days: 14