name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Operating system to build'
        type: choice
        options: [all, windows, macos]
        default: all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos' && '["macos-15"]' || '["windows-latest","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Run tests with coverage and lint
        uses: ./.github/actions/python-ci-checks

      - name: Stamp build id
        shell: pwsh
        env:
          SHA: ${{ github.sha }}
        run: 'Set-Content speak/_build.py "VERSION = `"dev-$($env:SHA.Substring(0, 7))`""'

      - name: Build package
        shell: pwsh
        run: ./build.ps1 -OutputDirectory ./dist

      - uses: actions/upload-artifact@v7
        with:
          path: dist/Speak-*
          archive: false
          if-no-files-found: error
          retention-days: 14